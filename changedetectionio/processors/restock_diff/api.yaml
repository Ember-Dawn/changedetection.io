components:
  schemas:
    processor_config_restock_diff:
      type: object
      description: |
        Purchase-oriented notification policy. First valid check creates a baseline
        without a notification. An alert fires when the product becomes qualified,
        or its price changes in either direction while it remains qualified.
      properties:
        alert_mode:
          type: string
          enum: [stock_and_price, stock_only, price_only]
          default: stock_only
          description: |
            stock_and_price: stock must be true AND price strictly below target.
            stock_only: notify when the product becomes in-stock.
            price_only: notify for price below target, regardless of stock.
        target_price:
          type: [number, 'null']
          minimum: 0
          description: Required in stock_and_price/price_only; strict less-than, not less-or-equal.
        extraction_mode:
          type: string
          enum: [auto, rule, builtin]
          default: auto
          description: Automatic Git-tracked product rules, one selected rule, or built-in extraction.
        extraction_rule_id:
          type: string
          description: Rule file ID from extractor-rules/rules (required in rule mode).

paths:
  /watch:
    post:
      x-code-samples:
        - lang: 'curl'
          label: 'Watch a product only when available below $1300'
          source: |
            curl -X POST 'http://localhost:5000/api/v1/watch' \
              -H 'x-api-key: YOUR_API_KEY' -H 'Content-Type: application/json' \
              -d '{"url":"https://example.com/product", "processor":"restock_diff", "processor_config_restock_diff":{"alert_mode":"stock_and_price", "target_price":1300, "extraction_mode":"auto"}}'
        - lang: 'Python'
          label: 'Track stock only'
          source: |
            import requests
            response = requests.post('http://localhost:5000/api/v1/watch',
                headers={'x-api-key': 'YOUR_API_KEY'},
                json={'url': 'https://example.com/product', 'processor': 'restock_diff',
                      'processor_config_restock_diff': {'alert_mode': 'stock_only'}})
            print(response.json())
  /watch/{uuid}:
    put:
      x-code-samples:
        - lang: 'curl'
          label: 'Change the target price'
          source: |
            curl -X PUT 'http://localhost:5000/api/v1/watch/YOUR-UUID' \
              -H 'x-api-key: YOUR_API_KEY' -H 'Content-Type: application/json' \
              -d '{"processor_config_restock_diff":{"alert_mode":"price_only", "target_price":1200}}'
  /tag/{uuid}:
    put:
      x-code-samples:
        - lang: 'curl'
          label: 'Override a tag with purchase conditions'
          source: |
            curl -X PUT 'http://localhost:5000/api/v1/tag/YOUR-TAG-UUID' \
              -H 'x-api-key: YOUR_API_KEY' -H 'Content-Type: application/json' \
              -d '{"overrides_watch":true,"processor_config_restock_diff":{"alert_mode":"stock_and_price", "target_price":1300}}'
