<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>快捷验证 · {{ watch_title }}</title>
<link rel="stylesheet" href="{{ url_for('quick_verify.static', filename='quick-verify.css', v=1) }}">
</head>
<body>
<main class="qv-shell">
<header class="qv-header"><div><div class="qv-eyebrow">QUICK VERIFY</div><h1>人机验证</h1></div><span class="qv-status" id="qv-connection">准备连接</span></header>
<div class="qv-title" title="{{ watch_title }}">{{ watch_title }}</div>
<p class="qv-message" id="qv-message" aria-live="polite">正在检查人工浏览器状态…</p>
<section class="qv-occupied" id="qv-occupied" hidden>
 <p id="qv-occupied-text">已有人工浏览器会话，无法自动连接。</p>
 <div class="qv-inline"><button type="button" id="qv-resume" hidden>恢复我的会话</button><button type="button" id="qv-check">刷新状态</button></div>
</section>
<section class="qv-screen" id="qv-screen" aria-label="远程浏览器画面" tabindex="0">
 <img id="qv-frame" alt="可操作的远程浏览器画面" draggable="false" hidden>
 <div id="qv-placeholder">连接后将在这里显示浏览器画面</div>
</section>
<div class="qv-hint">单指点击；长按拖动；双指上下滑动滚动；双指捏合缩放画面</div>
<div class="qv-input-row"><input id="qv-text" type="text" maxlength="512" placeholder="向远程输入框输入文字" autocomplete="off" aria-label="远程文字输入"><button id="qv-send" type="button" disabled>发送</button><button id="qv-enter" type="button" disabled>Enter</button></div>
<div class="qv-tools"><button type="button" id="qv-reload" disabled>刷新网页</button><button type="button" id="qv-back" disabled>后退</button><button type="button" id="qv-fit">恢复缩放</button></div>
<div class="qv-primary"><button type="button" id="qv-finish" disabled>完成并重新检查</button><button type="button" id="qv-close" disabled>退出操作</button></div>
<p class="qv-note">退出不会将验证码标记为已解除；只有重新检查成功后才确认恢复。</p>
<button id="qv-connect" type="button" hidden>重新连接</button>
</main>
<script>window.quickVerifyConfig = {{ {'api': url_for('manual_browser.index'), 'csrf': csrf_token(), 'watchUuid':watch_uuid, 'needsAttention':needs_attention, 'fixedViewport':fixed_viewport} | tojson }};</script>
<script src="{{ url_for('manual_browser.static', filename='manual-core.js', v=11) }}"></script>
<script defer src="{{ url_for('quick_verify.static', filename='quick-verify.js', v=1) }}"></script>
</body></html>
