{% extends 'base.html' %}
{% block content %}
<style>
#manual-browser-root{max-width:1480px;margin:auto}
#manual-browser-root .manual-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
#manual-browser-root .manual-address{flex:1 1 360px;min-width:180px}
#manual-browser-root .manual-view{background:#161b24;min-height:200px;width:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;touch-action:none}
#manual-browser-root .manual-view img{max-width:100%;width:auto;height:auto;display:block;user-select:none;cursor:crosshair}
#manual-browser-root .manual-icon{height:36px;width:36px;display:inline-flex;align-items:center;justify-content:center;padding:8px}
#manual-browser-root .manual-icon svg{width:16px;height:16px}
#manual-browser-root .manual-view:focus{outline:none}
#manual-browser-root .manual-view:focus-visible{outline:2px solid #4b9bff;outline-offset:2px}
#manual-browser-root .manual-cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#eee;pointer-events:none;background:#161b24;text-align:center;padding:16px}
#manual-browser-root .manual-session-notice{padding:12px;border:1px solid #999;border-radius:6px;margin:10px 0}
#manual-browser-root [hidden]{display:none!important}
#manual-browser-root button:disabled{opacity:.5}
#manual-browser-root .manual-status{display:flex;flex-wrap:wrap;gap:16px;font-size:.9em;margin:12px 0}
@media(max-width:680px) { #manual-browser-root .manual-address{flex-basis:100%} }
</style>
<div class="box" id="manual-browser-root">
  <h3>人工操作 · 共享 CloakBrowser</h3>
  <p>同一个 Persistent Context 中的 Tab，关闭窗口不会删除 Cookie。</p>
  <input type="hidden" id="manual-csrf" value="{{ csrf_token() }}">
  <input type="hidden" id="manual-watch-uuid" value="{{ watch_uuid }}">
  <div id="manual-existing" class="manual-session-notice" hidden>
    <strong id="manual-existing-title">已有人工会话</strong>
    <p id="manual-existing-description" style="overflow-wrap:anywhere"></p>
    <div class="manual-row">
      <button id="manual-resume" type="button" class="pure-button pure-button-primary" hidden>恢复已有会话</button>
      <button id="manual-switch" type="button" class="pure-button" hidden>关闭旧会话并打开当前网站</button>
      <button id="manual-check" type="button" class="pure-button">刷新状态</button>
    </div>
  </div>
  <div class="manual-row">
    <button id="manual-back" type="button" class="pure-button manual-icon" disabled aria-label="后退" title="后退"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
    <button id="manual-forward" type="button" class="pure-button manual-icon" disabled aria-label="前进" title="前进"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    <input id="manual-url" class="pure-input-1 manual-address" value="{{ initial_url }}" maxlength="2048" spellcheck="false" placeholder="输入网址，按 Enter 前往" aria-label="浏览器地址栏">
    <button id="manual-open" type="button" class="pure-button pure-button-primary">连接浏览器</button>
    <button id="manual-go" type="button" class="pure-button" disabled>前往</button>
    <button id="manual-refresh" type="button" class="pure-button" disabled>刷新</button>
  </div>
  <div class="manual-row">
    <button id="manual-finish" type="button" class="pure-button pure-button-primary" disabled>完成并重新检查</button>
    <button id="manual-close" type="button" class="pure-button" disabled>关闭会话</button>
    <strong id="manual-state" role="status" aria-live="polite">未连接</strong>
  </div>
  <div id="manual-frame-wrap" class="manual-view" tabindex="0" aria-label="实时浏览器控制区域">
    <img id="manual-frame" alt="实时浏览器画面" draggable="false" hidden>
    <div id="manual-cover" class="manual-cover">点击「连接浏览器」开始操作。</div>
  </div>
  <div class="manual-status">
    <span id="manual-connection">○ 未连接</span>
    <span id="manual-site-data"></span>
    <span id="manual-remaining"></span>
  </div>
  <details>
    <summary>浏览器详情</summary>
    <p id="manual-detail" style="overflow-wrap:anywhere"></p>
  </details>
  <div class="manual-row">
    <label for="manual-text">输入文字</label>
    <input id="manual-text" type="text" maxlength="512" placeholder="先点击画面中的输入框" style="flex:1;min-width:170px">
    <button id="manual-type" type="button" class="pure-button" disabled>发送文字</button>
    <button id="manual-enter" type="button" class="pure-button" disabled>Enter</button>
    <button id="manual-backspace" type="button" class="pure-button" disabled>Backspace</button>
  </div>
  <p style="opacity:.75">点击画面进行鼠标操作、滚轮滚动，画面获得焦点后可使用键盘。空闲 15 分钟自动关闭；关闭网页标签页后仍可恢复该会话。</p>
</div>
<script>
window.manualBrowserConfig = {{ {'api': url_for('manual_browser.index'), 'csrf': csrf_token()} | tojson }};
</script>
<script src="{{ url_for('manual_browser.static', filename='manual-browser.js') }}"></script>
{% endblock %}
