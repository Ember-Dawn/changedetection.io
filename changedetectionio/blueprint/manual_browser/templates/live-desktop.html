<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>实时浏览器</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b24;color:white;font:14px system-ui}#screen{width:100%;height:100%;display:block}#tip{position:absolute;top:12px;left:12px;background:#222b;padding:8px 12px;border-radius:6px;pointer-events:none}</style>
</head><body><div id="screen" tabindex="0" aria-label="实时浏览器远程桌面"></div><div id="tip">正在连接实时浏览器…</div>
<script type="module">
import RFB from './assets/core/rfb.js';
const tip=document.getElementById('tip');
const protocol=location.protocol==='https:'?'wss:':'ws:';
// A Werkzeug websocket=True route may make url_for() generate an absolute ws:// URL.
// Keep its routed path while retaining the browser's public host and TLS scheme.
const endpoint=new URL({{ url_for('manual_browser.live_websocket') | tojson }},location.href);
const ws=protocol+'//'+location.host+endpoint.pathname+'?csrf='+encodeURIComponent({{ csrf | tojson }});
let rfb;
try {
  rfb=new RFB(document.getElementById('screen'),ws);
  rfb.scaleViewport=true;
  rfb.resizeSession=false;
  rfb.viewOnly=false;
  rfb.addEventListener('connect',()=>{tip.hidden=true;});
  rfb.addEventListener('disconnect',()=>{tip.hidden=false;tip.textContent='连接已断开，请刷新页面重连';});
} catch(e) { tip.textContent='无法连接远程桌面：'+e.message; }
</script></body></html>
