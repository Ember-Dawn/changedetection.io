# One container; the CloakBrowser binary launches inside changedetection.
services:
  changedetection:
    build:
      context: .
      dockerfile: Dockerfile.cloakbrowser
    image: changedetection-cloakbrowser:local
    container_name: changedetection-cloakbrowser
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    stop_grace_period: 70s
    ports:
      - "${CHANGEDETECTION_PORT:-9901}:5000"
    environment:
      CLOAKBROWSER_LICENSE_KEY: ${CLOAKBROWSER_LICENSE_KEY:?Set a valid key in .env}
      CLOAKBROWSER_HUMANIZE: "true"
      FETCH_WORKERS: ${FETCH_WORKERS:-3}
      CLOAKBROWSER_PROFILE_DIR: /browser-profile
      CLOAKBROWSER_MAX_PAGES: ${CLOAKBROWSER_MAX_PAGES:-3}
      CLOAKBROWSER_VIEWPORT_WIDTH: ${CLOAKBROWSER_VIEWPORT_WIDTH:-1366}
      CLOAKBROWSER_VIEWPORT_HEIGHT: ${CLOAKBROWSER_VIEWPORT_HEIGHT:-900}
      CLOAKBROWSER_RECOVERY_MAX_RETRIES: ${CLOAKBROWSER_RECOVERY_MAX_RETRIES:-3}
      CLOAKBROWSER_RECOVERY_INITIAL_DELAY: ${CLOAKBROWSER_RECOVERY_INITIAL_DELAY:-2}
    volumes:
      - ./datastore:/datastore
      # Downloaded Chromium cache, NOT the future persistent Chrome profile
      - ./cloakbrowser-home:/root/.cloakbrowser
      # Persistent cookies, localStorage, IndexedDB, history and fingerprint seed.
      - ./browser-profile:/browser-profile
      # Git-tracked declarative product extraction rules (editable in WebUI).
      - ./extractor-rules:/extractor-rules
